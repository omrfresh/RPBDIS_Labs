<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Локации</title>
    <link href="lib/bootstrap/css/bootstrap.css" rel="stylesheet" />
    <script src="lib/jquery/dist/jquery.js"></script>
    <link href="lib/jquery-ui/themes/base/jquery-ui.min.css" rel="stylesheet" />
    <script src="lib/jquery-ui/jquery-ui.js"></script>
</head>
<body onload="initializePage()">
    <div class="container">
        <h2>Список локаций</h2>
        <form name="locationForm">
            <table border="0">
                <tr>
                    <td>
                        <label for="locationId" id="typeCRUD">Добавить:</label>
                        <input type="hidden" id="locationId" name="locationId" value="0" />
                        <div class="form-group">
                            <label>Название:</label>
                            <input class="form-control" name="name" id="name" required />
                        </div>
                        <div class="form-group">
                            <label>Описание:</label>
                            <input class="form-control" name="locationDescription" id="locationDescription" required />
                        </div>
                        <div class="form-group">
                            <label>Тип рекламы:</label>
                            <select id="adTypeId" name="adTypeId" required></select>
                        </div>
                        <div class="form-group">
                            <label>Описание рекламы:</label>
                            <input class="form-control" name="adDescription" id="adDescription" />
                        </div>
                        <div class="form-group">
                            <label>Стоимость:</label>
                            <input class="form-control" name="cost" id="cost" required type="number" step="0.01" />
                        </div>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <div class="panel-body">
                            <button id="saveBtn" type="submit" class="btn btn-sm btn-primary">Сохранить</button>
                            <button type="button" id="reset" class="btn btn-sm btn-primary">Сбросить</button>
                        </div>
                    </td>
                </tr>
            </table>
        </form>

        <table class="table table-condensed table-striped table-bordered">
            <thead>
                <tr>
                    <th>Код</th>
                    <th>Название</th>
                    <th>Описание</th>
                    <th>Тип рекламы</th>
                    <th>Описание рекламы</th>
                    <th>Стоимость</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="data"></tbody>
        </table>
    </div>

    <script>
        async function initializePage() {
            await GetAdTypes();
            await GetLocations();
        }

        async function GetAdTypes() {
            const response = await fetch("/api/locations/adtypes");
            if (response.ok) {
                const adTypes = await response.json();
                const select = document.getElementById("adTypeId");
                adTypes.forEach(adType => {
                    const option = document.createElement("option");
                    option.value = adType.adTypeId;
                    option.text = adType.name;
                    select.appendChild(option);
                });
            } else {
                console.error("Ошибка при загрузке типов рекламы.");
            }
        }

        async function GetLocations() {
            const response = await fetch("/api/locations");
            if (response.ok) {
                const locations = await response.json();
                const rows = document.querySelector("table tbody#data");
                rows.innerHTML = "";
                locations.forEach(location => rows.append(row(location)));
            } else {
                console.error("Ошибка при загрузке списка локаций.");
            }
        }

        function row(location) {
            const tr = document.createElement("tr");
            tr.setAttribute("data-rowid", location.locationId);

            tr.innerHTML = `
                        <td>${location.locationId}</td>
                        <td>${location.name}</td>
                        <td>${location.locationDescription}</td>
                        <td>${location.adTypeName || ""}</td>
                        <td>${location.adDescription}</td>
                        <td>${location.cost}</td>
                        <td>
                            <a class="editLink" data-id="${location.locationId}" onclick="Edit(${location.locationId})">Изменить</a>
                            <a class="removeLink" data-id="${location.locationId}" onclick="Delete(${location.locationId})">Удалить</a>
                        </td>
                    `;
            return tr;
        }

        async function Edit(id) {
            document.getElementById("typeCRUD").innerHTML = "Изменить:";
            const response = await fetch('/api/locations/' + id);
            if (response.ok) {
                const location = await response.json();
                const form = document.forms["locationForm"];
                form.elements["locationId"].value = location.locationId;
                form.elements["name"].value = location.name;
                form.elements["locationDescription"].value = location.locationDescription;
                form.elements["adTypeId"].value = location.adTypeId;
                form.elements["adDescription"].value = location.adDescription;
                form.elements["cost"].value = location.cost;
            } else {
                console.error("Ошибка при загрузке данных локации.");
            }
        }

        async function Delete(id) {
            const response = await fetch("/api/locations/" + id, {
                method: "DELETE"
            });
            if (response.ok) {
                document.querySelector("tr[data-rowid='" + id + "']").remove();
            } else {
                console.error("Ошибка при удалении локации.");
            }
        }

        document.forms["locationForm"].addEventListener("submit", async function (e) {
            e.preventDefault();
            const form = e.target;
            const locationId = form.elements["locationId"].value;
            const locationData = {
                locationId: parseInt(locationId, 10), // Убедитесь, что locationId передается в теле запроса
                name: form.elements["name"].value,
                locationDescription: form.elements["locationDescription"].value,
                adTypeId: form.elements["adTypeId"].value,
                adDescription: form.elements["adDescription"].value,
                cost: parseFloat(form.elements["cost"].value)
            };
            if (locationId == 0) {
                await CreateLocation(locationData);
            } else {
                await EditLocation(locationId, locationData);
            }
        });

        async function CreateLocation(locationData) {
            const response = await fetch("/api/locations", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(locationData)
            });
            if (response.ok) {
                const location = await response.json();
                resetForm();
                document.querySelector("table tbody#data").append(row(location));
            } else {
                console.error("Ошибка при создании локации.");
            }
        }

        async function EditLocation(id, locationData) {
            console.log("Отправляем данные для обновления:", locationData); // Логируем данные перед отправкой

            // Проверка на наличие всех обязательных полей
            if (!locationData.name || !locationData.locationDescription || !locationData.adTypeId || locationData.cost === undefined) {
                console.error("Все поля должны быть заполнены.");
                return;
            }

            try {
                const response = await fetch("/api/locations/" + id, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(locationData)
                });

                if (response.ok) {
                    resetForm();
                    const location = await response.json();
                    document.querySelector("tr[data-rowid='" + location.locationId + "']").replaceWith(row(location));
                } else {
                    const errorText = await response.text(); // Получаем текст ошибки
                    console.error("Ошибка при обновлении локации:", errorText);
                }
            } catch (error) {
                console.error("Ошибка сети или сервера:", error);
            }
        }

        function resetForm() {
            const form = document.forms["locationForm"];
            form.reset();
            form.elements["locationId"].value = 0;
            document.getElementById("typeCRUD").innerHTML = "Добавить:";
        }

        document.getElementById("reset").addEventListener("click", resetForm);
    </script>
</body>
</html>
