<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Типы рекламы</title>
    <link href="lib/bootstrap/css/bootstrap.css" rel="stylesheet" />
    <script src="lib/jquery/dist/jquery.js"></script>
    <link href="lib/jquery-ui/themes/base/jquery-ui.min.css" rel="stylesheet" />
    <script src="lib/jquery-ui/jquery-ui.js"></script>
    <script src="lib/jquery-ui/ui/i18n/datepicker-ru.js"></script>
    <script>
        $(function () {
            //ввод даты с использованием специального окна
            $("#date").datepicker({ dateFormat: "yy-mm-dd" });
        });
    </script>
</head>
<body onload="">
    <div class="container">
        <h2>Список типов рекламы</h2>
        <form name="adTypeForm">
            <table border="0">
                <tr>
                    <td>
                        <label for="adTypeId" id="typeCRUD" name="typeCRUD">Добавить:</label>
                        <input type="hidden" id="adTypeId" name="adTypeId" value=0 />
                        <div class="form-group">
                            <label>Название:</label>
                            <input class="form-control" name="name" id="name" />
                        </div>
                        <div class="form-group">
                            <label>Описание:</label>
                            <input class="form-control" name="description" id="description" />
                        </div>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <div class="panel-body">
                            <button id="saveBtn" type="submit" class="btn btn-sm btn-primary">Сохранить</button>
                            <a id="reset" class="btn btn-sm btn-primary">Сбросить</a>
                        </div>
                    </td>
                </tr>
            </table>
        </form>

        <table class="table table-condensed table-striped table-bordered">
            <thead><tr><th>Код</th><th>Название</th><th>Описание</th><th>Действие</th></tr></thead>
            <tbody id="data"></tbody>
        </table>
    </div>

    <script>
        // Получение всех типов рекламы
        function GetAdTypes() {
            $.ajax({
                url: '/api/adtypes',
                type: 'GET',
                contentType: "application/json",
                success: function (adTypes) {
                    var rows = "";
                    $.each(adTypes, function (index, adType) {
                        rows += row(adType);
                    })
                    $("table tbody#data").append(rows);
                }
            });
        }

        // Получение одного типа рекламы
        function GetAdType(id) {
            $.ajax({
                url: '/api/adtypes/' + id,
                type: 'GET',
                contentType: "application/json",
                success: function (adType) {
                    var form = document.forms["adTypeForm"];
                    form.elements["adTypeId"].value = adType.adTypeId;
                    form.elements["name"].value = adType.name;
                    form.elements["description"].value = adType.description;
                }
            });
        }

        // Добавление типа рекламы
        function CreateAdType(name, description) {
            $.ajax({
                url: "api/adtypes",
                contentType: "application/json",
                method: "POST",
                data: JSON.stringify({
                    name: name,
                    description: description
                }),
                success: function (adType) {
                    reset();
                    $("table tbody#data").append(row(adType));
                }
            })
        }

        // Изменение типа рекламы
        function EditAdType(adTypeId, name, description) {
            $.ajax({
                url: "api/adtypes/" + adTypeId,
                contentType: "application/json",
                method: "PUT",
                data: JSON.stringify({
                    adTypeId: parseInt(adTypeId),
                    name: name,
                    description: description
                }),
                success: function (adType) {
                    reset();
                    $("tr[data-rowid='" + adType.adTypeId + "']").replaceWith(row(adType));
                }
            })
        }

        // сброс формы
        function reset() {
            var form = document.forms["adTypeForm"];
            form.reset();
            form.elements["adTypeId"].value = 0;
            $("#typeCRUD").html("Добавить:");
        }

        // Удаление типа рекламы
        function DeleteAdType(id) {
            $.ajax({
                url: "api/adtypes/" + id,
                contentType: "application/json",
                method: "DELETE",
                success: function (adType) {
                    $("tr[data-rowid='" + id + "']").remove();
                }
            })
        }

        // создание строки для таблицы
        var row = function (adType) {
            return "<tr data-rowid='" + adType.adTypeId + "'><td>" + adType.adTypeId + "</td>" +
                "<td>" + adType.name + "</td>" +
                "<td>" + adType.description + "</td>" +
                "<td><a class='editLink' data-id='" + adType.adTypeId + "'>Изменить</a> | " +
                "<a class='removeLink' data-id='" + adType.adTypeId + "'>Удалить</a></td></tr>";
        }

        // сброс значений формы
        $("#reset").click(function (e) {
            e.preventDefault();
            reset();
        })

        // фильтрация
        $("#filter").click(function (e) {
            GetAdTypes();
        })

        // отправка формы
        $("form").submit(function (e) {
            e.preventDefault();
            var adTypeId = this.elements["adTypeId"].value;
            var name = this.elements["name"].value;
            var description = this.elements["description"].value;
            if (adTypeId == 0)
                CreateAdType(name, description);
            else
                EditAdType(adTypeId, name, description);
        });

        // нажатие на ссылку Изменить
        $("body").on("click", ".editLink", function () {
            var id = $(this).data("id");
            $("#typeCRUD").html("Изменить:");
            GetAdType(id);
            reset();
        })

        // нажатие на ссылку Удалить
        $("body").on("click", ".removeLink", function () {
            var id = $(this).data("id");
            DeleteAdType(id);
            reset();
        })

        // загрузка данных для таблицы и ее формирование
        GetAdTypes();
    </script>
</body>
</html>
