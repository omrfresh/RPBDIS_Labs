name: build and test

on:
  push:
  pull_request:
    branches: [ Lab6 ]
    paths:
    - 'Lab6/**.cs'
    - 'Lab6/**.csproj'

env:
  DOTNET_VERSION: '8.0' # The .NET SDK version to use

jobs:
  build:

    name: build-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install dependencies
      run: dotnet restore Lab6/Lab6.sln

    - name: Build
      run: dotnet build Lab6/Lab6.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test Test/Test.csproj --no-restore --verbosity normal
